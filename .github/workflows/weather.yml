name: KMA cold warning
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: kma-weather
  cancel-in-progress: false
jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch KMA warning
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: python3 scripts/weather.py
      - name: Publish status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weather.json
          git diff --cached --quiet || (git commit -m 'Update weather status' && git push)
